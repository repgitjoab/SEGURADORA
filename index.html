*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 24px;border-bottom:1px solid var(--grid);background:var(--surface);position:sticky;top:0;z-index:5}

header .sp{flex:1}

select,input[type=search],button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--axis);border-radius:8px;padding:6px 10px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.campo{background:var(--card);border:1px solid var(--ring);border-radius:10px;padding:8px 12px}

<header>

<script>window.FIREBASE_CONFIG = {"projectId": "pendencias-seguradoras", "appId": "1:697215792147:web:e91381d4edc2cf4806bbe6", "storageBucket": "pendencias-seguradoras.firebasestorage.app", "apiKey": "AIzaSyA5e7bgdZ92fa8kYaDIuvhrabUgWLd1xxc", "authDomain": "pendencias-seguradoras.firebaseapp.com", "messagingSenderId": "697215792147", "projectNumber": "697215792147", "version": "2"};</script>
<script>// Backend Firebase (Firestore) do dashboard de pendências de seguradora.
// Coleção "seguradoras":  meta (info + vendedores) | parte_0..N (dados do robô) | respostas (map nf -> resposta)
(function () {
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const db = firebase.firestore();
  const col = db.collection('seguradoras');
  const q = new URLSearchParams(location.search);
  window.VEND_INICIAL = q.get('v') || '';
  window.WEB_URL = location.origin + location.pathname;
  let META = null;

  async function sha(s) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s)));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  function agora() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  window.BACK = {
    async carregar() {
      const m = await col.doc('meta').get();
      if (!m.exists) return {dados: null, just: {}, vendedores: []};
      META = m.data();
      const partes = await Promise.all([...Array(META.partes || 0).keys()].map(i => col.doc('parte_' + i).get()));
      const txt = partes.map(p => (p.data() || {}).txt || '').join('');
      const r = await col.doc('respostas').get();
      const just = (r.exists && r.data().m) || {};
      return {
        dados: JSON.parse(txt),
        just,
        vendedores: (META.vendedores || []).map(v => ({vendedor: v.vendedor, nome: v.nome, temPin: !!v.pin_hash})),
      };
    },
    async salvar(r) {
      const v = ((META && META.vendedores) || []).find(x => x.vendedor === r.vendedor) || {};
      let por = v.nome || r.vendedor;
      if (v.pin_hash) {
        const h = await sha(r.pin || '');
        if (h === (META.pin_gestor_hash || '#')) por = 'GESTOR';
        else if (h !== v.pin_hash) throw new Error('PIN incorreto para ' + r.vendedor + '.');
      }
      if (!r.resp && !r.status) throw new Error('Responda a pergunta do caso.');
      const reg = {quando: agora(), status: r.status || '', acao: r.acao || '', nf_dev: r.nf_dev || '', obs: r.obs || '',
                   fluxo: r.fluxo || '', resp: r.resp || '', campos: r.campos || {},
                   vendedor: r.vendedor || '', portal: r.portal || '', seguradora: r.seguradora || '',
                   categoria: r.categoria || '', por};
      const FV = firebase.firestore.FieldValue;
      await col.doc('respostas').set({m: {[r.nf]: Object.assign({}, reg, {hist: FV.arrayUnion(reg)})}}, {merge: true});
      const atual = await col.doc('respostas').get();
      return ((atual.data() || {}).m || {})[r.nf] || Object.assign({hist: [reg]}, reg);
    },
  };
})();
</script>
<script>
const CAT_ESTILO = {
  dev_pendente:     {c:'var(--critical)', i:'↩', dk:false, d:'Portal confirma a devolução, mas o vendedor não lançou no sistema – financeiro não consegue baixar.'},
  dev_nf_cilia:     {c:'var(--serious)',  i:'⇄', dk:false, d:'Devolução já lançada (saldo abatido), mas falta anexar a NF de devolução no portal.'},
  dev_divergente:   {c:'var(--serious)',  i:'≠', dk:false, d:'Devolução lançada, mas o saldo não bate com o valor devolvido no portal.'},
  valor_incorreto:  {c:'var(--serious)',  i:'$', dk:false, d:'Valor da nota diferente do aprovado no laudo / da NF anexada no portal.'},
  nf_nao_anexada:   {c:'var(--warning)',  i:'!', dk:true,  d:'A nota não foi inserida no pedido do portal – seguradora não paga.'},
  entrega_pendente: {c:'var(--warning)',  i:'⏱', dk:true, d:'Peças sem baixa de entrega no portal.'},
  ok_aguardando:    {c:'var(--good)',     i:'✓', dk:false, d:'Tudo certo no portal – só falta a seguradora pagar (cobrar).'},
  nao_localizado:   {c:'var(--neutral)',  i:'?', dk:false, d:'Pedido/sinistro/placa não encontrados no portal.'},
  nao_consultado:   {c:'var(--info)',     i:'…', dk:false, d:'Robô ainda não consultou este pedido.'},
};
const GRUPOS = [
  {id:'dev', nome:'Devolução', i:'↩', c:'var(--critical)', d:'Peças devolvidas/canceladas no portal', cats:['dev_pendente','dev_nf_cilia','dev_divergente'], extra:true},
  {id:'nf', nome:'Problema na nota fiscal', i:'$', c:'var(--serious)', d:'Nota não inserida no portal ou emitida com valor errado', cats:['nf_nao_anexada','valor_incorreto']},
  {id:'ent', nome:'Entrega não baixada no portal', i:'⏱', c:'var(--warning)', dk:true, d:'Peças sem baixa de entrega', cats:['entrega_pendente']},
  {id:'ok', nome:'OK – aguardando pagamento', i:'✓', c:'var(--good)', d:'Tudo certo no portal – cobrar a seguradora', cats:['ok_aguardando']},
  {id:'out', nome:'Sem informação do portal', i:'?', c:'var(--neutral)', d:'Não localizado ou ainda não consultado', cats:['nao_localizado','nao_consultado']},
];
const NOME_SUB = {dev_pendente:'Não lançada no sistema (saldo integral)', dev_nf_cilia:'Lançada, falta NF de devolução no portal', dev_divergente:'Lançada com valor divergente',
  nf_nao_anexada:'Nota não inserida no portal', valor_incorreto:'Nota emitida com valor incorreto', entrega_pendente:'Entrega não baixada', ok_aguardando:'OK – aguardando pagamento',
  nao_localizado:'Não localizado no portal', nao_consultado:'Aguardando consulta do robô'};
const GRUPO_ITEM = {
  entregue:['Entregue','var(--good)'], em_entrega:['Em entrega','var(--warning)'], aguardando_nota:['Ag. nota / aprovado','var(--warning)'],
  devolvido:['Devolvido','var(--critical)'], cancelado:['Cancelado','var(--critical)'], nao_aprovado:['Fora da NF / não comprado','var(--neutral)'], outro:['Outro','var(--neutral)']
};
const brl = v => (v==null||isNaN(v)) ? '—' : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null, sel={cat:null, sinal:null, seg:null, cf:null, grupo:null}, ordem={k:'saldo',dir:-1};

function carregar(d){
  D=d; const PR=D.portais_robo||{CILIA:'Cilia'};
  D.cil = D.notas.filter(n=>n.portal in PR);
  D.outros = D.notas.filter(n=>!(n.portal in PR));
  fPortal.innerHTML='<option value="">Todos os portais</option>'+Object.entries(PR).map(([k,v])=>`<option value="${k}">${esc(v)} (${D.cil.filter(n=>n.portal===k).length})</option>`).join('');
  document.getElementById('meta').textContent = `Planilha: ${D.planilha} · gerado em ${D.gerado_em}`;
  const segs=[...new Set(D.cil.map(n=>nomeSeg(n.cliente)))].sort();
  const vends=[...new Set(D.cil.map(n=>n.vendedor).filter(Boolean))].sort();
  fSeg.innerHTML='<option value="">Todas as seguradoras</option>'+segs.map(s=>`<option>${esc(s)}</option>`).join('');
  fVend.innerHTML='<option value="">Todos os vendedores</option>'+vends.map(s=>`<option>${esc(s)}</option>`).join('');
  render();
}
function nomeSeg(c){ // agrupa variações do nome (S/A, S.A., SUCURSAL…)
  c=(c||'').toUpperCase().replace(/\s+/g,' ');
  for (const k of ['ALLIANZ','SURA','ZURICH','TOKIO','MAPFRE','CAIXA','EZZE','DARWIN','HDI','PORTO','BRADESCO','LIBERTY','YELUM','SOMPO','AZUL','ITAU','SUHAI','TOKIO','GENERALI','MITSUI','JUSTOS','PIER','YOUSE'])
    if (c.includes(k)) return k==='TOKIO'?'TOKIO MARINE':k;
  return c.split(' ').slice(0,2).join(' ');
}
function filtradas(ignorarCat, ignorarVend){
  const q=fBusca.value.trim().toUpperCase().replace(/[\s\-]/g,'');
  return D.cil.filter(n=>{
    if (fPortal.value && n.portal!==fPortal.value) return false;
    if (fSeg.value && nomeSeg(n.cliente)!==fSeg.value) return false;
    if (!ignorarVend && fVend.value && n.vendedor!==fVend.value) return false;
    if (sel.seg && nomeSeg(n.cliente)!==sel.seg) return false;
    if (!ignorarCat && sel.cat && n.categoria!==sel.cat) return false;
    if (!ignorarCat && sel.grupo && !GRUPOS.find(g=>g.id===sel.grupo).cats.includes(n.categoria)) return false;
    if (!ignorarCat && sel.cf && (sel.cf==='tela_devolver'?!n.tela_devolver:n.conf_fin!==sel.cf)) return false;
    if (!ignorarCat && sel.sinal && !(n.sinais_fin||[]).includes(sel.sinal)) return false;
    if (q){ const h=[n.nf,n.pedido,n.sinistro,n.placa,n.cliente].join('|').toUpperCase().replace(/[\s\-]/g,''); if(!h.includes(q)) return false; }
    return true;
  });
}
function soma(a,k){return a.reduce((s,n)=>s+(n[k]||0),0)}

function render(){

        ${a.length?`<button class="mini" data-xgrupo="${g.id}" title="Exportar Excel do grupo">⤓ Excel</button>`:''}</div>
      <div class="gn"><span class="n">${a.length}</span> <span class="muted">NFs</span> <span class="r">${brl(soma(a,'saldo'))}</span></div>`;
    if (g.cats.length>1 || g.extra){
      h+=`<div class="subs">`+g.cats.map(k=>{const b=a.filter(n=>n.categoria===k), st=CAT_ESTILO[k]||{};
        return `<div class="sub ${sel.cat===k?'ativo':''} ${b.length?'':'z'}" data-cat="${k}" title="${esc(st.d||'')}"><i style="background:${st.c}"></i><span>${esc(NOME_SUB[k]||D.categorias[k])}</span><b>${b.length}</b><span class="r">${brl(soma(b,'saldo'))}</span>${b.length?`<button class="mini" data-xcat="${k}" title="Exportar Excel">⤓</button>`:'<span></span>'}</div>`}).join('');
      if (g.extra){
        h+=`<div class="subsep">Conferência com a anotação do financeiro <span class="muted">(notas já contadas em algum grupo)</span></div>`+
          [['tela_devolver','Consta na tela A DEVOLVER do Prismatec','var(--critical)'],['cilia_sem_fin','Portal mostra devolução que o financeiro não anotou','var(--serious)'],['fin_sem_cilia','Financeiro anotou devolução, mas o portal não mostra','var(--neutral)']].map(([k,t,c])=>{const b=base.filter(n=>k==='tela_devolver'?!!n.tela_devolver:n.conf_fin===k);
          return `<div class="sub ${sel.cf===k?'ativo':''} ${b.length?'':'z'}" data-cf="${k}"><i style="background:${c}"></i><span>${t}</span><b>${b.length}</b><span class="r">${brl(soma(b,'saldo'))}</span><span></span></div>`}).join('');
      }

    } else {

  // por vendedor

  h+=`<div class="listahdr"><h2>Problemas por vendedor</h2><span class="sp"></span><button id="xvendtodos" title="Um arquivo com uma aba por vendedor">⤓ Excel – todos os vendedores</button></div>

    vArr.map(({v,a,prob})=>`<tr class="${fVend.value===v?'on':''}" style="cursor:default"><td><a href="#" data-abrirvend="${esc(v)}" title="Abrir a página do vendedor"><b>${esc(v)}</b></a></td><td class="num">${a.length}</td><td class="num">${brl(soma(a,'saldo'))}</td><td class="num ${prob.length?'vermelho':''}">${brl(soma(prob,'saldo'))}</td><td class="num">${respResumo(a)}</td>`+
      cats.map(k=>{const q=a.filter(n=>n.categoria===k).length;return `<td class="c ${q?'':'z'}" ${q?`data-vend="${esc(v)}" data-vcat="${k}" data-tip="${esc(v)} · ${esc(D.categorias[k])}: ${q} NFs · ${brl(soma(a.filter(n=>n.categoria===k),'saldo'))}"`:''}>${q||'·'}</td>`}).join('')+
      `<td style="white-space:nowrap"><button class="mini" data-vver="${esc(v)}">${fVend.value===v?'Todos':'Ver'}</button> <button class="mini" data-xvend="${esc(v)}">⤓ Excel</button></td></tr>`).join('')+
    `</tbody></table></div>`;

  // sinais do financeiro + seguradoras
  const sinais={}; base.forEach(n=>(n.sinais_fin||[]).forEach(s=>{(sinais[s]=sinais[s]||[]).push(n)}));
  const segs={}; base.forEach(n=>{const s=nomeSeg(n.cliente);(segs[s]=segs[s]||[]).push(n)});
  const segArr=Object.entries(segs).map(([s,a])=>[s,soma(a,'saldo'),a.length]).sort((a,b)=>b[1]-a[1]);
  const mx=segArr.length?segArr[0][1]:1;
  h+=`<div class="dois"><div><h2>Saldo por seguradora</h2><div class="painel">`+
    segArr.map(([s,v,q])=>`<div class="barra" data-seg="${esc(s)}" data-tip="${esc(s)}: ${brl(v)} · ${q} NFs" ${sel.seg===s?'style="background:var(--accent-wash)"':''}>
      <span class="nm">${esc(s)}</span><span class="tr"><div class="fl" style="width:${Math.max(1,v/mx*100)}%"></div></span><span class="vl">${brl(v)}</span></div>`).join('')+
    `</div></div><div><h2>Anotações do financeiro</h2><div class="painel"><div class="chips">`+
    Object.entries(sinais).sort((a,b)=>b[1].length-a[1].length).map(([s,a])=>`<span class="chip ${sel.sinal===s?'ativo':''}" data-sinal="${esc(s)}">${esc(s)} <b>${a.length}</b> · ${brl(soma(a,'saldo'))}</span>`).join('')+
    `</div><p class="muted" style="margin:10px 0 0;font-size:12px">Extraído da coluna “Observação” da planilha. É só referência: a situação de cada nota vale sempre pelo que o robô lê no portal.</p>
    <p class="muted" style="margin:6px 0 0;font-size:12px">Portais ainda sem robô: ${Object.entries(D.outros.reduce((o,n)=>(o[n.portal]=(o[n.portal]||0)+1,o),{})).map(([p,q])=>`${esc(p)} ${q}`).join(' · ')}</p></div></div></div>`;

  // lista
  const lista=filtradas(false);
  const CFN={tela_devolver:'Consta na tela A DEVOLVER do Prismatec',fin_sem_cilia:'Financeiro anotou devolução, mas o portal não mostra',cilia_sem_fin:'Portal mostra devolução que o financeiro não anotou'};
  const titBase = sel.cf? CFN[sel.cf] : sel.cat? (GRUPOS.find(g=>g.cats.includes(sel.cat))||{}).nome+' › '+(NOME_SUB[sel.cat]||D.categorias[sel.cat]) : sel.grupo? GRUPOS.find(g=>g.id===sel.grupo).nome : sel.sinal? 'Financeiro: '+sel.sinal : 'Todas as NFs portal';
  window._tit=titBase;
  const tit = titBase + (fVend.value?' · '+fVend.value:'');
  h+=`<div class="listahdr" id="lista"><h2>${esc(tit)}${sel.seg?' · '+esc(sel.seg):''} — ${lista.length} NFs · ${brl(soma(lista,'saldo'))}</h2><span class="sp"></span>
     ${(sel.cat||sel.sinal||sel.seg||sel.cf||sel.grupo)?'<button id="limpar">Limpar seleção</button>':''}<button id="xlista">⤓ Excel desta lista</button></div>`;
  h+=tabela(lista);

const COLS=[['nf','NF'],['portal_nome','Portal'],['vendedor','Vendedor'],['emissao','Emissão'],['vencimento','Venc.'],['dias_atraso','Atraso',1],['cliente','Seguradora'],['pedido','Pedido'],['sinistro','Sinistro'],['placa','Placa'],
  ['valor','Valor NF',1],['saldo','Saldo',1],['valor_esperado','Valor portal',1],['valor_devolvido','Devolvido',1],['categoria','Situação'],['resp','Resposta vendedor'],['motivo','Motivo']];
function tabela(lista){
  const k=ordem.k, dir=ordem.dir;
  lista=[...lista].sort((a,b)=>{let x=a[k],y=b[k]; if(k==='emissao'||k==='vencimento'){x=dt(x);y=dt(y)}
    if(x==null) return 1; if(y==null) return -1; return (x>y?1:x<y?-1:0)*dir;});
  if(!lista.length) return '<div class="painel vazio-msg">Nenhuma NF nesta seleção.</div>';
  return `<div class="tabwrap"><table><thead><tr>${COLS.map(([c,t,nu])=>`<th class="${nu?'num':''}" data-ord="${c}">${t}${ordem.k===c?(dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>`+
    lista.map(n=>{const st=CAT_ESTILO[n.categoria]||{}; return `<tr data-nf="${esc(n.nf)}">
      <td><b>${esc(n.nf)}</b></td><td>${esc(n.portal_nome||'')}</td><td>${esc(n.vendedor||'')}</td><td>${esc(n.emissao)}</td><td>${esc(n.vencimento)}</td>
      <td class="num ${n.dias_atraso>60?'vermelho':''}">${n.dias_atraso??''}</td><td>${esc(nomeSeg(n.cliente))}</td>
      <td>${esc(n.pedido)}</td><td>${esc(n.sinistro)}</td><td>${esc(n.placa)}</td>
      <td class="num">${brl(n.valor)}</td><td class="num">${brl(n.saldo)}</td><td class="num">${n.valor_esperado==null?'—':brl(n.valor_esperado)}</td>
      <td class="num">${n.valor_devolvido?brl(n.valor_devolvido):'—'}</td>
      <td><span class="tag" style="--c:${st.c}"><i></i>${esc(NOME_SUB[n.categoria]||D.categorias[n.categoria]||'')}</span></td>
      <td>${tagResp(n)}</td>
      <td class="mot">${esc((n.motivos||[])[0]||'')}</td></tr>`}).join('')+`</tbody></table></div>`;
}
function dt(s){const m=/(\d+)\/(\d+)\/(\d+)/.exec(s||'');return m?+(m[3]+m[2].padStart(2,'0')+m[1].padStart(2,'0')):null}

function detalhe(nf){

  const campo=(l,v)=>`<div class="campo"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  let h=`<div class="alerta" style="--c:${st.c}"><b>${esc(NOME_SUB[n.categoria]||D.categorias[n.categoria])}</b>${n.confirmado?'':' <span class="muted">(ainda não confirmado no portal)</span>'}<ul style="margin:6px 0 0;padding-left:18px">${(n.motivos||[]).map(m=>`<li>${esc(m)}</li>`).join('')||'<li class="muted">Sem observações.</li>'}</ul></div>`;
  h+=`<div class="grid2">${campo('Seguradora',esc(n.cliente))}${campo('CNPJ',esc(n.cnpj))}${campo('Emissão / Venc.',esc(n.emissao)+' · '+esc(n.vencimento))}${campo('Atraso',(n.dias_atraso??'—')+' dias')}
    ${campo('Valor NF',brl(n.valor))}${campo('Saldo',brl(n.saldo))}${campo('Peças desta NF no portal',n.valor_esperado==null?'—':brl(n.valor_esperado))}${campo('Devolvido no portal',n.valor_devolvido==null?'—':brl(n.valor_devolvido))}

      ${campo('Seguradora no portal',esc(c.seguradora||'—'))}${campo('Veículo',esc((c.veiculo||'—')+(c.placa_cilia?' · '+c.placa_cilia:'')))}${campo('Oficina',esc((c.oficina||'—')+(c.oficina_cidade&&c.oficina_cidade!=='/'?' · '+c.oficina_cidade:'')))}${campo('Pedido criado em',esc((c.criado_em||'').split('-').reverse().join('/')||'—'))}
      ${campo('Total pedido / Líquido',brl(c.total_pedido)+' / '+brl(c.total_liquido))}${campo('NFs anexadas',esc((c.notas_fiscais||[]).join(', ')||(c.notas_lidas?'nenhuma':'não lido')))}
      ${c.aba?campo('Aba',esc(c.aba)):''}${c.url?campo('Link',`<a href="${esc(c.url)}" target="_blank">abrir no portal ↗</a>`):''}</div>`;
    const it=[...(c.itens||[])].sort((a,b)=>(b.desta_nf?1:0)-(a.desta_nf?1:0)||((a.grupo==='nao_aprovado')-(b.grupo==='nao_aprovado')));
    const rn=(c.resumo_nf||[]);
    if (rn.length) h+=`<div class="grid2">`+rn.map(r=>campo(''+esc(n.portal_nome||'Portal')+' · '+esc(r.unidade||''),
        `NF venda ${brl(r.nf_venda)} · NF devolução ${brl(r.nf_devolucao)}<br>Saldo ${brl(r.saldo)}${r.saldo_reserva?` · Reserva ${brl(r.saldo_reserva)}`:''}`)).join('')+`</div>`;
    if ((c.notas_detalhe||[]).length) h+=`<h2>NFs anexadas no portal</h2><div class="tabwrap"><table><thead><tr><th>NF</th><th>Tipo</th><th>Situação</th><th class="num">Valor</th><th>Peças</th></tr></thead><tbody>`+
       c.notas_detalhe.map(x=>`<tr style="cursor:default${x.numero.replace(/^0+/,'')===n.nf.replace(/^0+/,'')?';background:var(--accent-wash)':''}"><td><b>${esc(x.numero)}</b></td><td>${esc(x.tipo)}</td><td>${esc(x.situacao)}${x.recusa?' – '+esc(x.recusa):''}</td><td class="num">${brl(x.valor)}</td><td style="white-space:normal">${esc((x.itens||[]).join(', '))}</td></tr>`).join('')+`</tbody></table></div>`;
    const daNF=it.filter(i=>i.desta_nf).length;
    h+=`<h2>Peças do pedido (${it.length})${daNF?` <span class="muted" style="text-transform:none">– destacadas as ${daNF} desta NF</span>`:(n.itens_escopo==='pedido'?' <span class="muted" style="text-transform:none">– pedido inteiro</span>':'')}</h2>`;
    h+= it.length?`<div class="tabwrap"><table><thead><tr><th>Status portal</th><th>Grupo</th><th class="num">Qtd</th><th>Código</th><th>Item</th><th class="num">Preço un.</th><th class="num">Total</th><th>NF</th><th>Prev. entrega</th></tr></thead><tbody>`+
      it.map(i=>{const g=GRUPO_ITEM[i.grupo]||GRUPO_ITEM.outro; const fora=i.grupo==='nao_aprovado';
        return `<tr style="cursor:default${i.desta_nf?';background:var(--accent-wash)':''}${fora?';opacity:.55':''}"><td>${esc(i.status_nome||i.status)}</td><td><span class="tag" style="--c:${g[1]}"><i></i>${g[0]}</span></td>
        <td class="num">${esc(i.qtd)}</td><td>${esc(i.codigo||'')}</td><td style="white-space:normal;min-width:240px${fora?';text-decoration:line-through':''}">${esc(i.item)}</td><td class="num">${i.preco_un!=null&&i.preco_un!==''?(typeof i.preco_un==='number'?brl(i.preco_un):esc(i.preco_un)):''}</td><td class="num">${i.total!=null?brl(i.total):''}</td><td>${esc(i.nf||'')}${i.dev_pendente?' <span class="tag" style="--c:var(--critical)"><i></i>dev. pendente</span>':''}</td><td>${esc((i.prev_entrega||'').split('-').reverse().join('/'))}</td></tr>`}).join('')+`</tbody></table></div>`
      : `<div class="painel muted">${c.encontrado?'Itens não lidos.':esc(c.erro||'Não encontrado.')}</div>`;
    if (c.notas_texto) h+=`<h2>Notas Fiscais (texto capturado)</h2><pre>${esc(c.notas_texto)}</pre>`;
  }
  const hist=(n.obs_financeiro||'').split(/\s{2,}|(?=\b\d{2}\/\d{2}\s)/).map(s=>s.trim()).filter(Boolean);
  h+=blocoRespostaDrawer(n);
  h+=`<h2>Histórico do financeiro</h2><div class="hist">${hist.map(s=>`<div>${esc(s)}</div>`).join('')||'<div class="muted">Sem anotações.</div>'}</div>`;
  h+=`<h2>Observação da nota</h2><pre>${esc(n.obs_nota)}</pre>`;
  if (c.texto_pagina) h+=`<details><summary class="muted">Texto bruto da página do portal</summary><pre>${esc(c.texto_pagina)}</pre></details>`;
  dwB.innerHTML=h; dw.classList.add('on'); ov.classList.add('on'); dw.scrollTop=0;
}

function linhasNotas(l){

async function exportar(arquivo, abas){
  const dt=new Date().toLocaleDateString('pt-BR').replace(/\//g,'-');
  arquivo=nomeArq(arquivo)+'_'+dt;
  if(await carregarXLSX()){
    const wb=XLSX.utils.book_new();
    for(const [nome,rows] of Object.entries(abas)){
      const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'':'Sem registros'}]);
      const cab=Object.keys(rows[0]||{'':''});
      ws['!cols']=cab.map(c=>({wch:Math.min(60,Math.max(c.length+2,...rows.slice(0,200).map(r=>String(r[c]??'').length+1)))}));
      ws['!autofilter']={ref:ws['!ref']};
      XLSX.utils.book_append_sheet(wb,ws,nomeAba(nome));
    }
    XLSX.writeFile(wb,arquivo+'.xlsx');
  } else { // sem internet: CSV da primeira aba
    const rows=Object.values(abas).find(r=>r.length)||[]; const cab=Object.keys(rows[0]||{});
    const f=v=>typeof v==='number'?String(v).replace('.',','):'"'+String(v??'').replace(/"/g,'""')+'"';
    const b=new Blob(['﻿'+cab.join(';')+'\n'+rows.map(r=>cab.map(c=>f(r[c])).join(';')).join('\n')],{type:'text/csv'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=arquivo+'.csv';a.click();
    alert('Sem acesso à biblioteca do Excel (internet). Exportei em CSV, que também abre no Excel.');
  }
}

function situacaoReg(j){
  if(!j) return null;
  const c=j.campos||{};
  // robô rodou depois da resposta e ainda vê a mesma pendência?
  const roboDepois = D && dataNum(D.gerado_em) > dataNum(j.quando);
  if (!j.fluxo){   // resposta no formato antigo
    return {cod:'acao', txt:(j.status||'Respondido')+(j.acao?' – '+j.acao:''), cor:'var(--info)'};
  }
  if (j.resp==='nao') return {cod:'acao', txt:'Pendente: '+(c.motivo||'sem motivo')+(c.previsao?' · previsão '+fmtData(c.previsao):''), cor:'var(--serious)',
                              alerta: c.previsao && c.previsao<hojeISO() ? 'Previsão vencida' : ''};
  if (j.fluxo==='dev'){
    if (c.chegou) return {cod:'baixa', txt:'Mercadoria chegou – aguardando baixa do financeiro', cor:'var(--good)'};
    const venc = c.previsao && c.previsao<hojeISO();
    return {cod:'aguarda', txt:'Coleta solicitada'+(c.transportadora?' · '+c.transportadora:'')+(c.nf_retorno?' · NF retorno '+c.nf_retorno:'')+(c.previsao?' · chega '+fmtData(c.previsao):''),

  }

  return {cod:'aguarda', txt:feito+' – aguardando o robô confirmar', cor:roboDepois?'var(--warning)':'var(--info)',
          alerta: roboDepois ? 'Robô rodou depois e o portal ainda mostra pendente' : ''};
}

       <span class="muted" style="font-size:12px"> · ${esc(j.quando)}</span>
     ${aberto?'':`<button class="mini" data-editresp="${esc(n.nf)}" style="margin-left:6px">${s.cod==='aguarda'&&j.fluxo==='dev'?'Atualizar / mercadoria chegou':'Atualizar'}</button>`}</div>`;
  if (aberto) h+=formCaso(n);
  return h+`</div>`;
}

const FILTROS_V = [['todos','Todos'],['sem','Sem resposta'],['acao','Pendente comigo'],['aguarda','Aguardando chegada / robô'],['baixa','Aguardando baixa financeiro'],['alerta','⚠ Atenção']];
function filtroCaso(n,k){ const s=situacao(n);
  if(k==='todos') return true; if(k==='sem') return !s; if(k==='alerta') return !!(s&&s.alerta); return !!s && s.cod===k; }
function renderVend(){
  const v=modoVend;
  const todos=D.cil.filter(n=>(n.vendedor||'(sem vendedor)')===v && (!fPortal.value||n.portal===fPortal.value));
  const crit=todos.filter(n=>CRIT.includes(n.categoria)).sort((a,b)=>(!!JUST[a.nf])-(!!JUST[b.nf])||b.saldo-a.saldo);
  const okL=todos.filter(n=>n.categoria==='ok_aguardando').sort((a,b)=>b.saldo-a.saldo);
  const outL=todos.filter(n=>!CRIT.includes(n.categoria)&&n.categoria!=='ok_aguardando');
  const q=k=>crit.filter(n=>filtroCaso(n,k)).length;
  const nome=(VENDS.find(x=>x.vendedor===v)||{}).nome;
  const lk=linkVend(v);
  let h=`<div class="vtop">${window.VEND_INICIAL?'':'<button id="voltarvend">← Todos os vendedores</button>'}
     <h2 style="margin:0;font-size:20px;text-transform:none;color:var(--ink)">${esc(nome||v)} <span class="muted" style="font-size:13px">${nome?esc(v):''}</span></h2><span class="sp"></span>
     ${lk&&!window.VEND_INICIAL?`<button class="mini" data-copiar="${esc(lk)}">Copiar link deste vendedor</button>`:''}
     <button class="mini" data-xvend="${esc(v)}">⤓ Excel</button></div>
   <div class="kpis">
     <div class="kpi"><div class="l">Saldo em aberto</div><div class="v">${brl(soma(todos,'saldo'))}</div><div class="s">${todos.length} NFs</div></div>
     <div class="kpi"><div class="l">Casos para resolver</div><div class="v" style="color:var(--critical)">${crit.length}</div><div class="s">${brl(soma(crit,'saldo'))}</div></div>
     <div class="kpi"><div class="l">Sem resposta</div><div class="v">${q('sem')}</div><div class="s">${q('acao')} pendente(s) com você</div></div>
     <div class="kpi"><div class="l">Sua parte feita</div><div class="v" style="color:var(--good-ink)">${q('aguarda')+q('baixa')}</div><div class="s">${q('baixa')} aguardando baixa do financeiro</div></div>
     <div class="kpi"><div class="l">OK – aguardando seguradora</div><div class="v">${okL.length}</div><div class="s">${brl(soma(okL,'saldo'))}</div></div>
   </div>
   <div class="painel muted" style="font-size:12px;margin-bottom:12px">Responda cada caso. Não precisa concluir: o caso sai daqui sozinho quando o financeiro der baixa (NF some da planilha de pendências) ou quando o robô vir que o portal ficou certo.</div>
   <div class="chips" style="margin-bottom:12px">${FILTROS_V.map(([k,t])=>`<span class="chip ${filtroResp===k?'ativo':''}" data-fresp="${k}">${t} <b>${q(k)}</b></span>`).join('')}</div>`;
  h+=`<h2>Casos para você resolver</h2>`;
  const lc=crit.filter(n=>filtroCaso(n,filtroResp));
  h+= lc.length? lc.map(cardCaso).join('') : `<div class="painel vazio-msg">Nenhum caso nesta seleção. 👏</div>`;
  if (okL.length) h+=`<h2>OK no portal – aguardando pagamento da seguradora (${okL.length})</h2>`+tabela(okL);
  if (outL.length) h+=`<h2>Outros (${outL.length})</h2>`+tabela(outL);
  app.innerHTML=h;
}

function salvarResp(nf){
  const n=D.cil.find(x=>x.nf===nf), box=document.querySelector(`[data-form="${CSS.escape(nf)}"]`);
  const fk=box.dataset.fluxo, f=FLUXOS[fk];
  const resp=(box.querySelector(`input[name="resp_${CSS.escape(nf)}"]:checked`)||{}).value;
  if(!resp){ alert('Responda: '+f.pergunta); return; }
  const o=f[resp], campos={};
  o.campos.forEach(([nome])=>{const el=box.querySelector(`[name="${nome}"]`); campos[nome]=el?el.value.trim():'';});
  if(o.chk){ const el=box.querySelector(`[name="${o.chk[0]}"]`); campos[o.chk[0]]=!!(el&&el.checked); }
  if(campos.motivo==='' ){ alert('Selecione o motivo.'); return; }
  if(fk==='dev' && resp==='sim' && !campos.chegou && !campos.nf_retorno && !campos.transportadora){ alert('Informe a transportadora ou o nº da NF de retorno.'); return; }
  if(fk==='devnf' && resp==='sim' && !campos.nf_retorno){ alert('Informe o nº da NF de devolução.'); return; }
  const obs=(box.querySelector('[name="obs"]')||{}).value||'';
  const r={nf, vendedor:n.vendedor, portal:n.portal_nome||n.portal, seguradora:n.cliente, categoria:NOME_SUB[n.categoria]||n.categoria,
           fluxo:fk, resp, campos, obs:obs.trim(), nf_dev:campos.nf_retorno||campos.nf_nova||''};
  r.status=(situacaoReg({...r, quando:'99/99/9999'})||{}).txt||'Respondido';
  r.acao=f.pergunta+' '+(resp==='sim'?'Sim':'Não');
  const bt=box.querySelector('[data-salvar]'); bt.disabled=true; bt.textContent='Salvando…';
  BACK.salvar(r).then(j=>{ JUST[nf]=j; window._formAberto=null; if(window._resp) delete window._resp[nf]; render();
      const el=document.getElementById('caso_'+nf); if(el){ el.scrollIntoView({block:'center'}); el.classList.add('ok'); setTimeout(()=>el.classList.remove('ok'),1500);} })
    .catch(e=>{ alert(e.message||e); bt.disabled=false; bt.textContent='Salvar'; });
}

// ===================== GESTOR: COBRAR SEGURADORAS / AGUARDANDO BAIXA =====================
function ultimaEntrega(n){
  const it=((n.cilia||{}).itens||[]).filter(i=>i.desta_nf); let mx='';
  it.forEach(i=>{ const d=String(i.prev_entrega||'').slice(0,10); const iso=/^\d{4}-/.test(d)?d:d.split('/').reverse().join('-'); if(iso>mx) mx=iso; });
  return mx?fmtData(mx):'';
}
function linhasCobranca(l){
  return l.map(n=>({'Seguradora':n.cliente,'CNPJ':n.cnpj,'NF':n.nf,'Emissão':n.emissao,'Vencimento':n.vencimento,'Dias de atraso':n.dias_atraso,
    'Valor NF':n.valor,'Saldo em aberto':n.saldo,'Sinistro':n.sinistro,'Placa':n.placa,'Pedido':n.pedido,'Portal':n.portal_nome||'',
    'NF inserida no portal':'Sim','Peças entregues':'Sim','Entrega (portal)':ultimaEntrega(n),'Oficina':(n.cilia||{}).oficina||'','Vendedor':n.vendedor}));
}
function okFiltradas(){ return filtradas(true).filter(n=>n.categoria==='ok_aguardando'); }
function porSeg(l){ const o={}; l.forEach(n=>{const s=nomeSeg(n.cliente);(o[s]=o[s]||[]).push(n)}); return Object.entries(o).sort((a,b)=>soma(b[1],'saldo')-soma(a[1],'saldo')); }
function renderCobranca(){
  const l=okFiltradas(), grupos=porSeg(l);
  let h=abasTopo()+`<div class="kpis">
    <div class="kpi"><div class="l">OK – só falta a seguradora pagar</div><div class="v">${brl(soma(l,'saldo'))}</div><div class="s">${l.length} NFs · ${grupos.length} seguradoras</div></div>
    <div class="kpi"><div class="l">Vencidas</div><div class="v">${brl(soma(l.filter(n=>n.dias_atraso>0),'saldo'))}</div><div class="s">${l.filter(n=>n.dias_atraso>0).length} NFs</div></div>
    <div class="kpi"><div class="l">Mais de 60 dias</div><div class="v vermelho">${brl(soma(l.filter(n=>n.dias_atraso>60),'saldo'))}</div><div class="s">${l.filter(n=>n.dias_atraso>60).length} NFs</div></div></div>
  <div class="listahdr"><h2>Notas OK no portal – cobrar a seguradora</h2><span class="sp"></span><button id="xcobtodas">⤓ Excel – todas (uma aba por seguradora)</button></div>
  <p class="muted" style="margin:-6px 0 12px;font-size:12px">NF inserida e peças entregues no portal, sem pendência do nosso lado. Use “Copiar e-mail” para colar a tabela no e-mail para a seguradora.</p>`;
  if(!grupos.length) h+=`<div class="painel vazio-msg">Nenhuma nota OK aguardando pagamento nesta seleção.</div>`;
  for(const [s,a] of grupos){
    a.sort((x,y)=>(y.dias_atraso||0)-(x.dias_atraso||0));
    h+=`<div class="segbox"><div class="listahdr" style="margin:0 0 8px"><h2 style="margin:0">${esc(s)} — ${a.length} NFs · ${brl(soma(a,'saldo'))}</h2>
      <span class="muted" style="font-size:12px">mais antiga: ${Math.max(...a.map(n=>n.dias_atraso||0))} dias</span><span class="sp"></span>
      <button class="mini" data-email="${esc(s)}">✉ Copiar e-mail</button><button class="mini" data-xcob="${esc(s)}">⤓ Excel</button></div>
      <div class="tabwrap"><table><thead><tr><th>NF</th><th>Emissão</th><th>Venc.</th><th class="num">Atraso</th><th class="num">Saldo</th><th>Sinistro</th><th>Placa</th><th>Pedido</th><th>Portal</th><th>Entrega</th><th>Vendedor</th></tr></thead><tbody>`+
      a.map(n=>`<tr data-nf="${esc(n.nf)}"><td><b>${esc(n.nf)}</b></td><td>${esc(n.emissao)}</td><td>${esc(n.vencimento)}</td><td class="num ${n.dias_atraso>60?'vermelho':''}">${n.dias_atraso??''}</td>
        <td class="num">${brl(n.saldo)}</td><td>${esc(n.sinistro)}</td><td>${esc(n.placa)}</td><td>${esc(n.pedido)}</td><td>${esc(n.portal_nome||'')}</td><td>${esc(ultimaEntrega(n))}</td><td>${esc(n.vendedor||'')}</td></tr>`).join('')+
      `</tbody></table></div></div>`;
  }
  app.innerHTML=h;
}
function emailSeguradora(s){
  const a=okFiltradas().filter(n=>nomeSeg(n.cliente)===s).sort((x,y)=>(y.dias_atraso||0)-(x.dias_atraso||0));
  const cab=['NF','Emissão','Vencimento','Dias em atraso','Valor (R$)','Sinistro','Placa','Pedido','Portal'];
  const lin=a.map(n=>[n.nf,n.emissao,n.vencimento,n.dias_atraso??'',(n.saldo||0).toLocaleString('pt-BR',{minimumFractionDigits:2}),n.sinistro||'',n.placa||'',n.pedido||'',n.portal_nome||'']);
  const intro=`Prezados,\n\nSegue relação de notas fiscais da ${s} já inseridas no portal, com as peças entregues, que constam em aberto em nosso financeiro (total ${brl(soma(a,'saldo'))}).\nPor gentileza, verificar o motivo da pendência e nos informar a previsão de pagamento de cada uma.\n\n`;
  const fim=`\n\nFicamos à disposição.\nAtenciosamente,`;
  const txt=intro+[cab.join('\t'),...lin.map(r=>r.join('\t'))].join('\n')+fim;
  const td='style="border:1px solid #999;padding:3px 8px"';
  const html=`<p>${intro.trim().replace(/\n/g,'<br>')}</p><table style="border-collapse:collapse;font-family:Calibri,Arial;font-size:10pt"><tr>${cab.map(c=>`<th ${td} bgcolor="#e8e8e8">${c}</th>`).join('')}</tr>${lin.map(r=>`<tr>${r.map(c=>`<td ${td}>${esc(c)}</td>`).join('')}</tr>`).join('')}</table><p>${fim.trim().replace(/\n/g,'<br>')}</p>`;
  const ok=()=>alert(`E-mail da ${s} copiado (${a.length} NFs). Cole no Outlook/Gmail com Ctrl+V.`);
  if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
    navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([txt],{type:'text/plain'})})]).then(ok,()=>prompt('Copie o texto:',txt));
  } else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(ok,()=>prompt('Copie o texto:',txt)); }
  else prompt('Copie o texto:',txt);
}
function exportarCobranca(s){
  const l=okFiltradas();
  if(s){ exportar('Cobranca_'+s,{[s]:linhasCobranca(l.filter(n=>nomeSeg(n.cliente)===s))}); return; }
  const abas={'Resumo':porSeg(l).map(([sg,a])=>({'Seguradora':sg,'NFs':a.length,'Saldo':Math.round(soma(a,'saldo')*100)/100,'Maior atraso (dias)':Math.max(...a.map(n=>n.dias_atraso||0))}))};
  porSeg(l).forEach(([sg,a])=>abas[sg]=linhasCobranca(a));
  exportar('Cobranca_seguradoras',abas);
}
function linhasBaixa(l){
  return l.map(n=>{const j=JUST[n.nf]||{}, c=j.campos||{}, s=situacao(n)||{};
    return {'NF':n.nf,'Seguradora':n.cliente,'Vendedor':n.vendedor,'Portal':n.portal_nome||'','Saldo':n.saldo,'Devolvido no portal':n.valor_devolvido??'',
      'Situação':s.txt||'','Transportadora':c.transportadora||'','NF de retorno':c.nf_retorno||'','Previsão de chegada':fmtData(c.previsao),'Atenção':s.alerta||'',
      'Obs. vendedor':j.obs||'','Respondido em':j.quando||'','Pedido':n.pedido,'Sinistro':n.sinistro,'Placa':n.placa};});
}
function renderBaixa(){
  const base=filtradas(true).filter(n=>CRIT.includes(n.categoria));
  const chegou=base.filter(n=>(situacao(n)||{}).cod==='baixa');
  const coleta=base.filter(n=>{const j=JUST[n.nf]; return j&&j.fluxo==='dev'&&j.resp==='sim'&&!(j.campos||{}).chegou;});
  const alerta=base.filter(n=>(situacao(n)||{}).alerta);
  const semResp=base.filter(n=>!JUST[n.nf]);
  const tb=(l)=> l.length?`<div class="tabwrap"><table><thead><tr><th>NF</th><th>Vendedor</th><th>Seguradora</th><th class="num">Saldo</th><th>Situação informada</th><th>NF retorno</th><th>Previsão</th><th>Respondido em</th><th>Obs.</th></tr></thead><tbody>`+
    l.map(n=>{const j=JUST[n.nf]||{},c=j.campos||{},s=situacao(n)||{}; return `<tr data-nf="${esc(n.nf)}"><td><b>${esc(n.nf)}</b></td><td>${esc(n.vendedor||'')}</td><td>${esc(nomeSeg(n.cliente))}</td><td class="num">${brl(n.saldo)}</td>
      <td>${tagResp(n)}</td><td>${esc(c.nf_retorno||c.nf_nova||'')}</td><td class="${s.alerta?'vermelho':''}">${esc(fmtData(c.previsao))}</td><td>${esc(j.quando||'')}</td><td class="mot">${esc(j.obs||'')}</td></tr>`}).join('')+`</tbody></table></div>`
    : '<div class="painel muted">Nenhuma.</div>';
  app.innerHTML=abasTopo()+`<div class="kpis">
    <div class="kpi"><div class="l">Mercadoria chegou – financeiro baixar</div><div class="v" style="color:var(--good-ink)">${chegou.length}</div><div class="s">${brl(soma(chegou,'saldo'))}</div></div>
    <div class="kpi"><div class="l">Coletas em andamento</div><div class="v">${coleta.length}</div><div class="s">${brl(soma(coleta,'saldo'))}</div></div>
    <div class="kpi"><div class="l">⚠ Atenção</div><div class="v vermelho">${alerta.length}</div><div class="s">previsão vencida / robô ainda vê pendente</div></div>
    <div class="kpi"><div class="l">Casos sem resposta</div><div class="v">${semResp.length}</div><div class="s">${brl(soma(semResp,'saldo'))}</div></div></div>
   <div class="listahdr"><h2>Mercadoria chegou – cobrar baixa do financeiro (${chegou.length})</h2><span class="sp"></span><button id="xbaixa">⤓ Excel para o financeiro</button></div>${tb(chegou)}
   <div class="listahdr"><h2>Coletas solicitadas – aguardando chegada (${coleta.length})</h2></div>${tb(coleta)}
   <div class="listahdr"><h2>⚠ Atenção (${alerta.length})</h2></div>${tb(alerta)}`;
}
let aba='geral';
function abasTopo(){
  return `<div class="abas">${[['geral','Visão geral'],['cobranca','Cobrar seguradoras (OK)'],['baixa','Respostas dos vendedores / baixas']].map(([k,t])=>`<button class="aba ${aba===k?'on':''}" data-aba="${k}">${t}</button>`).join('')}</div>`;
}

document.addEventListener('click',e=>{
  const t=e.target;
  if(t.id==='voltarvend'){ sairVend(); return; }
  const ab=t.closest('[data-aba]'); if(ab){ aba=ab.dataset.aba; render(); return; }
  if(t.id==='xcobtodas'){ exportarCobranca(); return; }
  const xc=t.closest('[data-xcob]'); if(xc){ exportarCobranca(xc.dataset.xcob); return; }
  const em=t.closest('[data-email]'); if(em){ emailSeguradora(em.dataset.email); return; }
  if(t.id==='xbaixa'){ const base=filtradas(true).filter(n=>CRIT.includes(n.categoria));
     exportar('Aguardando_baixa_financeiro',{'Mercadoria chegou':linhasBaixa(base.filter(n=>(situacao(n)||{}).cod==='baixa')),
       'Coletas em andamento':linhasBaixa(base.filter(n=>{const j=JUST[n.nf]; return j&&j.fluxo==='dev'&&j.resp==='sim'&&!(j.campos||{}).chegou;})),
       'Todas as respostas':linhasBaixa(base.filter(n=>JUST[n.nf]))}); return; }
  const rs=t.closest('[data-resp]'); if(rs){ window._resp=window._resp||{}; window._resp[rs.dataset.resp]=rs.value; window._formAberto=rs.dataset.resp; render(); return; }
  const sv=t.closest('[data-salvar]'); if(sv){ salvarResp(sv.dataset.salvar); return; }
  const cr=t.closest('[data-cancelaresp]'); if(cr){ window._formAberto=null; if(window._resp) delete window._resp[cr.dataset.cancelaresp]; render(); return; }
  const ed=t.closest('[data-editresp]'); if(ed){ window._formAberto=ed.dataset.editresp; render(); return; }
  const fr=t.closest('[data-fresp]'); if(fr){ filtroResp=fr.dataset.fresp; render(); return; }
  const nd=t.closest('[data-nfdet]'); if(nd){ detalhe(nd.dataset.nfdet); return; }
  const cp=t.closest('[data-copiar]'); if(cp){ const s=cp.dataset.copiar; (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>{cp.textContent='Link copiado!';},()=>prompt('Copie o link:',s)); return; }
});

function carregarJustJSONP(){
  if(!D.web_url) return;
  window.__just = o => { JUST=o.just||{}; render(); };
  const s=document.createElement('script'); s.src=D.web_url+(D.web_url.includes('?')?'&':'?')+'acao=just&cb=__just&t='+Date.now();
  s.onerror=()=>{}; document.head.appendChild(s);
}
function iniciar(){
  if (window.VEND_INICIAL){ ['fVend','fSeg','btnArq'].forEach(id=>{const e=document.getElementById(id); if(e) e.style.display='none';}); }
  const vIni = window.VEND_INICIAL || decodeURIComponent(((location.hash||'').match(/v=([^&]+)/)||[])[1]||'');
  if (MODO_WEB){
    app.innerHTML='<div class="vazio-msg">Carregando…</div>';
    BACK.carregar().then(o=>{ JUST=o.just||{}; VENDS=o.vendedores||[];
        if(!o.dados){ app.innerHTML='<div class="vazio-msg">Ainda não há dados. Rode o robô no computador do gestor.</div>'; return; }
        carregar(o.dados); if(vIni){ modoVend=vIni; render(); } })
      .catch(e=>{ app.innerHTML='<div class="vazio-msg">Erro ao carregar: '+esc(e.message||e)+'</div>'; });
  } else if (window.DADOS_CILIA){
    carregar(window.DADOS_CILIA); carregarJustJSONP();
    if(vIni){ modoVend=vIni; render(); }
  }
}

iniciar();
</script>
